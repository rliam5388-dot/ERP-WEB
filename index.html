<div class="card">

<div class="heart">❤️</div>

<h1>Tengo una pregunta para ti...</h1>

<p class="texto">
Desde hace algún tiempo he descubierto que los momentos simples
se vuelven especiales cuando pienso en compartirlos contigo.

Y aunque podría esperar al momento perfecto,
prefiero crear uno contigo.

¿Me regalarías una cita? 🌹
</p>

<div class="opciones">

<label>📅 Elige el día que más te guste</label>
<input type="date" id="fecha">

<label>🕒 Elige la hora</label>
<input type="time" id="hora">

<label>✨ Elige nuestro plan</label>
<select id="plan">
    <option>🎬 Cine romántico</option>
    <option>🍷 Cena elegante</option>
    <option>🏡 Picnic en una cabaña</option>
</select>

</div>

<div class="botones">

<button id="si" onclick="aceptar()">
Sí, quiero salir contigo ❤️
</button>

<button id="no" onclick="rechazar()">
No 😔
</button>

</div>

<div id="mensaje"></div>

</div>

<script>

let escala = 1;
let intentos = 0;

const mensajes = [
"¿Segura? 🥺",
"Podría ser una noche muy bonita ❤️",
"Prometo hacerte sonreír 😊",
"Vamos... piénsalo otra vez 🌹",
"¿Y si resulta ser tu cita favorita? ✨",
"Mi corazón acaba de recibir daño crítico 💔",
"Creo que el botón correcto es el de Sí 😏",
"Última oportunidad para salvar mi corazón ❤️"
];

function rechazar(){

    let mensaje = document.getElementById("mensaje");
    let btnSi = document.getElementById("si");

    if(intentos < mensajes.length){
        mensaje.innerHTML =
        `<p style="margin-top:20px;color:#FFD700;font-size:1.2rem;">
        ${mensajes[intentos]}
        </p>`;
    }

    escala += 0.25;

    btnSi.style.transform =
    `scale(${escala})`;

    btnSi.style.boxShadow =
    "0 0 30px rgba(255,215,0,.8)";

    intentos++;

    if(intentos >= 8){
        document.getElementById("no").innerText =
        "¿Estás completamente segura? 🥺";
    }

    if(intentos >= 12){
        document.getElementById("no").style.opacity = ".4";
    }

    if(intentos >= 15){
        document.getElementById("no").style.display = "none";
    }
}

function aceptar(){

    const fecha = document.getElementById("fecha").value;
    const hora = document.getElementById("hora").value;
    const plan = document.getElementById("plan").value;

    if(!fecha || !hora){
        alert("❤️ Elige una fecha y una hora primero.");
        return;
    }

    document.body.innerHTML = `
    <div style="
        min-height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;
        text-align:center;
        padding:40px;
        background:linear-gradient(135deg,#4b0f24,#6e1631,#a71d46);
        color:white;
        font-family:Segoe UI;
    ">
        <div>

        <h1 style="
            font-size:4rem;
            margin-bottom:20px;">
            ❤️ ¡Aceptaste! ❤️
        </h1>

        <p style="
            font-size:1.5rem;
            line-height:1.8;">
            Entonces tenemos una cita.
            <br><br>
            📅 ${fecha}
            <br>
            🕒 ${hora}
            <br>
            ✨ ${plan}
        </p>

        <br>

        <p style="
            font-size:1.3rem;
            max-width:700px;">
            Gracias por darme la oportunidad
            de crear un recuerdo bonito contigo.
            Prometo hacer que cada minuto
            valga la pena. 🌹
        </p>

        </div>
    </div>
    `;
}

</script>
