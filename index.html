<body>

<div class="layout">

    <aside class="sidebar">

        <div class="logo">
            ERP-WEB
        </div>

        <a href="#">📊 Dashboard</a>
        <a href="#">📥 Recepciones MP</a>
        <a href="#">📦 Inventario</a>
        <a href="#">📑 Kardex</a>
        <a href="#">🧪 Formulación</a>
        <a href="#">🏭 Producción</a>
        <a href="#">🚚 Despachos</a>
        <a href="#">👥 Usuarios</a>

    </aside>

    <main class="content">

        <div class="header">

            <div>
                <h1>Recepción de Materia Prima</h1>
                <span>
                    Sistema ERP Web
                </span>
            </div>

        </div>

        <!-- DASHBOARD -->

        <div class="stats">

            <div class="stat">
                <h2 id="kpiRecepciones">0</h2>
                <span>Recepciones</span>
            </div>

            <div class="stat">
                <h2 id="kpiCantidad">0</h2>
                <span>Cantidad Total</span>
            </div>

            <div class="stat">
                <h2 id="kpiProductos">0</h2>
                <span>Productos</span>
            </div>

            <div class="stat">
                <h2 id="kpiProveedores">0</h2>
                <span>Proveedores</span>
            </div>

        </div>

        <!-- FORMULARIO -->

        <div class="card">

            <h3>Nueva Recepción</h3>

            <div class="form">

                <label>
                    SKU
                    <input id="sku">
                </label>

                <label>
                    Producto
                    <input id="producto">
                </label>

                <label>
                    Categoría
                    <input id="categoria">
                </label>

                <label>
                    Proveedor
                    <input id="proveedor">
                </label>

                <label>
                    Factura
                    <input id="factura">
                </label>

                <label>
                    Lote
                    <input id="lote">
                </label>

                <label>
                    Fecha Vencimiento
                    <input id="vence" type="date">
                </label>

                <label>
                    Temperatura
                    <input id="temp" type="number">
                </label>

                <label>
                    Cantidad
                    <input id="cantidad" type="number">
                </label>

            </div>

            <br>

            <button onclick="guardar()">
                Registrar Recepción
            </button>

        </div>

        <!-- BUSQUEDA -->

        <div class="card">

            <h3>Buscar</h3>

            <input
                id="buscar"
                placeholder="Buscar por producto, SKU, proveedor o lote..."
            >

        </div>

        <!-- TABLA -->

        <div class="card">

            <table>

                <thead>

                    <tr>
                        <th>ID</th>
                        <th>SKU</th>
                        <th>Producto</th>
                        <th>Proveedor</th>
                        <th>Lote</th>
                        <th>Cantidad</th>
                    </tr>

                </thead>

                <tbody id="tabla">

                </tbody>

            </table>

        </div>

    </main>

</div>

</body>
